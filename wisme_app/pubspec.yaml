name: wisme_app
description: "AI-Powered Microlearning That Feels Like a Podcast"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  
  # Firebase services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  
  # Audio and TTS
  audioplayers: ^6.1.0
  flutter_tts: ^4.1.0
  
  # State management
  provider: ^6.1.2
  
  # Network and HTTP
  http: ^1.2.2
  dio: ^5.7.0
  
  # Local storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  
  # Utilities
  crypto: ^3.0.5
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # Development utilities
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
